<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">个人图片占位</title>
  <description id="description">等待替换为用户提供的头像、项目或经历图片。</description>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ece6"/>
      <stop offset="0.55" stop-color="#96bdb6"/>
      <stop offset="1" stop-color="#273b3a"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#background)"/>
  <rect x="100" y="100" width="1400" height="800" rx="64" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="4" stroke-dasharray="18 18"/>
  <text x="800" y="485" fill="#fff" font-family="Arial, sans-serif" font-size="70" text-anchor="middle">YOUR IMAGE</text>
  <text x="800" y="570" fill="#fff" fill-opacity=".78" font-family="Arial, sans-serif" font-size="34" text-anchor="middle">头像 / 项目 / 经历图片待填写</text>
</svg>
